<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Bugtvind</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: et malet kort som scene til venstre, spotlisten som følge til højre; detaljer og steder nedenunder. Vinden tegnes som lysende tråde. */
:root{
  --sky-a:#ffdcae; --sky-b:#f7bcae; --panel:#fffdf8; --panel2:#fbeedd; --ink:#2b2330; --muted:#7c6a70; --rule:#edd3bb;
  --gold:#e5a52c; --accent:#7566c9; --accent-ink:#ffffff; --bar:#e0483a; --teal:#3b8d95;
  --go:#23915f; --warn:#e6a400; --stop:#d63b34; --on-status:#ffffff; --on-warn:#2a1a00;
  --side:#23915f; --onshore:#ffd23a; --off:#d63b34;
  --sea-1:#3d8d9d; --sea-2:#55a3ab; --sea-3:#7bbcb8; --sea-4:#a9d6c6; --foam:#fff3d6;
  --sand:#fbe3ab; --field-1:#f3bd55; --field-2:#eba845; --field-3:#f8d074; --forest:#dcae48; --forest-2:#2f6b4f; --forest-3:#f6cf35;
  --town:#f8e2bd; --town-2:#d9573f; --lake:#7cc6c9; --road:#7b5038; --road-case:#f8d98f; --thread:#ffffff; --haze:255,168,150;
  --font-display:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --font-caps:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --font-body:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --lift:0 14px 34px -18px rgba(90,40,40,.5);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky-a:#3b2542; --sky-b:#1f2440; --panel:#2a2238; --panel2:#352b45; --ink:#fbeede; --muted:#b9a6b4; --rule:#4b3d57;
  --gold:#f0b84a; --accent:#a99cf0; --accent-ink:#1c1638; --bar:#f0604f; --teal:#6cc0c4;
  --go:#4fd093; --warn:#ffc83d; --stop:#f4695f; --on-status:#0c1a14; --on-warn:#2a1a00;
  --side:#4fd093; --onshore:#ffd23a; --off:#f4695f;
  --sea-1:#1b3d54; --sea-2:#245068; --sea-3:#316779; --sea-4:#44818a; --foam:#e6c592;
  --sand:#b88f58; --field-1:#a4722f; --field-2:#93632b; --field-3:#b38338; --forest:#7f6a2f; --forest-2:#1d4739; --forest-3:#c99c2b;
  --town:#7c5b4c; --town-2:#cf5a44; --lake:#3f8894; --road:#3b2720; --road-case:#b88a45; --thread:#f4ecf4; --haze:210,90,120;
  --lift:0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --sky-a:#3b2542; --sky-b:#1f2440; --panel:#2a2238; --panel2:#352b45; --ink:#fbeede; --muted:#b9a6b4; --rule:#4b3d57;
  --gold:#f0b84a; --accent:#a99cf0; --accent-ink:#1c1638; --bar:#f0604f; --teal:#6cc0c4;
  --go:#4fd093; --warn:#ffc83d; --stop:#f4695f; --on-status:#0c1a14; --on-warn:#2a1a00;
  --side:#4fd093; --onshore:#ffd23a; --off:#f4695f;
  --sea-1:#1b3d54; --sea-2:#245068; --sea-3:#316779; --sea-4:#44818a; --foam:#e6c592;
  --sand:#b88f58; --field-1:#a4722f; --field-2:#93632b; --field-3:#b38338; --forest:#7f6a2f; --forest-2:#1d4739; --forest-3:#c99c2b;
  --town:#7c5b4c; --town-2:#cf5a44; --lake:#3f8894; --road:#3b2720; --road-case:#b88a45; --thread:#f4ecf4; --haze:210,90,120;
  --lift:0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--sky-b) linear-gradient(165deg,var(--sky-a),var(--sky-b) 70%) fixed;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;min-height:100%}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:28px}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-family:var(--font-caps);font-size:11px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

/* ramme */
.frame{position:relative;width:min(100%,calc((100dvh - 100px) * .756));min-width:min(100%,340px);margin-inline:auto;border-radius:18px;border:1px solid var(--rule);box-shadow:var(--lift);background:var(--panel);overflow:hidden}
.map{position:relative;aspect-ratio:560/741;background:var(--sea-2);overflow:hidden}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(var(--haze),.42),rgba(var(--haze),0) 48%)}
.map #wind{pointer-events:none}
.map #shore{pointer-events:none}
.layer{position:absolute;inset:0}
.glass{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--rule);border-radius:14px}
.place-name{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-caps);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#2b2330;text-shadow:0 0 4px rgba(255,246,225,.95),0 0 2px rgba(255,246,225,.95);pointer-events:none;white-space:nowrap}
.place-name.town{transform:translate(-50%,-150%)}
.place-name.e{transform:translate(9px,-50%)}
.place-name.w{transform:translate(calc(-100% - 9px),-50%)}
.place-name.big{font-size:14px;font-weight:600}
.place-name.area{font-weight:400;letter-spacing:.3em;opacity:.75}
.place-name.sea{color:#fff;text-shadow:0 1px 5px rgba(20,60,80,.55);font-weight:400;font-size:12px;letter-spacing:.34em;opacity:.9}
.hud{position:absolute;left:18px;top:12px;padding:8px 14px 9px 12px;z-index:4;display:flex;flex-direction:column;gap:3px;max-width:calc(100% - 80px)}
.hud{border-left:6px solid var(--bar);border-radius:4px 14px 14px 4px;box-shadow:-6px 0 0 var(--accent)}
.hud h1{font-size:23px;font-weight:600;letter-spacing:.02em;text-transform:lowercase}
.hud .now{display:flex;align-items:center;gap:8px}
.hud .big{font-family:var(--font-display);font-size:26px;line-height:1}
.hud small{color:var(--muted);font-size:12px;line-height:1.3}
.arrow{width:24px;height:24px;flex:none;transition:transform .5s}
.arrow path{fill:var(--accent)}
.feed{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);text-align:left}
.feed i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.feed.live i{background:var(--go);animation:pulse 2s infinite}
.feed.cache i,.feed.snap i{background:var(--warn)}
.feed.none i{background:var(--stop)}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--go)}70%{box-shadow:0 0 0 7px transparent}}
.north{position:absolute;right:12px;top:12px;font-family:var(--font-caps);font-size:14px;border-radius:99px;padding:2px 10px;z-index:4}
.key{position:absolute;left:12px;bottom:12px;z-index:4;padding:6px 12px 8px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.key div{display:flex;flex-wrap:wrap;gap:2px 12px}
.key span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.key i{width:16px;height:6px;border-radius:3px;display:inline-block}
.key .feed i{width:8px;height:8px;border-radius:50%}
.credit{position:absolute;right:12px;bottom:8px;font-size:10px;color:#fff;opacity:.85;text-shadow:0 1px 3px rgba(15,20,60,.9);z-index:2;text-align:right}

.spot{position:absolute;width:0;height:0;border:0;padding:0;background:none;cursor:pointer;--c:var(--muted);--on:var(--on-status)}
.spot.go{--c:var(--go)} .spot.warn{--c:var(--warn);--on:var(--on-warn)} .spot.stop{--c:var(--stop)}
.spot .line{position:absolute;left:0;top:-1px;height:2px;background:#fffaf0;transform-origin:0 50%;border-radius:2px}
.spot .dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fffaf0;box-shadow:0 0 0 1.5px #2f3a35}
.spot .kite{position:absolute;width:26px;height:26px;margin:-13px;transform:rotate(45deg);border-radius:5px;border:2px solid #fffaf0;background:var(--c);box-shadow:0 0 0 1px rgba(40,50,45,.55),0 3px 0 rgba(40,50,45,.25);display:grid;place-items:center}
.spot .kite b{transform:rotate(-45deg);font-family:var(--font-body);font-weight:700;font-size:13px;line-height:1;color:var(--on);font-variant-numeric:tabular-nums}
.spot .tag{position:absolute;white-space:nowrap;font-family:var(--font-body);font-size:13px;font-weight:500;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--rule);border-radius:99px;padding:0 9px 0 5px;line-height:1.5;display:inline-flex;align-items:center;gap:4px}
.spot .tag svg{width:13px;height:13px;transition:transform .5s}
.spot .tag path{fill:var(--accent)}
.spot.sel{z-index:3}
.spot.sel .kite{width:30px;height:30px;margin:-15px;box-shadow:0 0 0 1px rgba(40,50,45,.55),0 0 0 5px color-mix(in srgb,var(--c) 40%,transparent),0 4px 0 rgba(40,50,45,.25)}
.spot.sel .kite b{font-size:16px}
.spot.sel .tag{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.spot.sel .tag path{fill:var(--panel)}
.spot:hover .kite{filter:brightness(1.1)}
@media (prefers-reduced-motion:no-preference){ .spot.go .kite{animation:float 3.2s ease-in-out infinite} }
@keyframes float{50%{translate:0 -4px}}

/* spotkort inde i rammen */
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;background:var(--panel);border-top:1px solid var(--rule);min-width:0}
.info header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.info h2{font-size:25px}
.x{border:0;background:none;font-size:20px;line-height:1;padding:2px 4px;cursor:pointer;color:var(--muted)}
.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--font-caps);font-size:14px;letter-spacing:.03em;padding:3px 12px;border-radius:99px;color:var(--on-status);background:var(--muted);line-height:1.3}
.chip.go{background:var(--go)} .chip.warn{background:var(--warn);color:var(--on-warn)} .chip.stop{background:var(--stop)}
.wind{display:flex;gap:12px;align-items:center}
.wind svg{width:74px;height:74px;flex:none;border-radius:50%;border:1px solid var(--rule)}
.wind .big{font-family:var(--font-display);font-size:32px;line-height:1}
.wind .big small{font-family:var(--font-body);font-size:13px;color:var(--muted)}
.wind p{color:var(--muted);font-size:13px;line-height:1.35}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.trio div{background:var(--panel);padding:5px 8px}
.trio b{display:block;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.15}
.trio .label{font-size:12px}
.hours{position:relative;overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--panel2)}
.hours ol{list-style:none;margin:0;padding:0;display:flex;width:max-content}
.hr{width:34px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 0;border:0;border-right:1px solid color-mix(in srgb,var(--rule) 40%,transparent);background:none;cursor:pointer;font-size:11px}
.hr.day{border-left:2px solid var(--gold)}
.hr.cur{background:var(--panel)}
.hr .t{color:var(--muted)}
.hr .a{width:14px;height:14px}
.hr .a path{fill:var(--ink)}
.hr .s{font-family:var(--font-display);font-size:17px;line-height:1}
.hr .g{color:var(--muted);line-height:1}
.hr .bar{width:100%;height:6px;margin-top:3px;background:var(--muted)}
.hr .bar.go{background:var(--go)} .hr .bar.warn{background:var(--warn)} .hr .bar.stop{background:var(--stop)}

/* tid */
.time{padding:10px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--panel2);border-top:1px solid var(--rule);min-width:0}
.time .when{font-family:var(--font-display);font-size:22px;min-width:5.6em}
.time input{width:100%;accent-color:var(--accent);min-width:0}
.btn{font-family:var(--font-caps);font-size:15px;letter-spacing:.04em;border:1px solid var(--rule);border-radius:99px;background:var(--panel2);padding:3px 14px;cursor:pointer}
.btn:hover{border-color:var(--gold)}

@media (min-width:900px){
  .frame{display:grid;grid-template-columns:minmax(0,1fr) 330px;width:min(100%,calc((100dvh - 100px) * .756 + 330px))}
  .info{grid-column:2;grid-row:1 / span 2;border-top:0;border-left:1px solid var(--rule);justify-content:center}
}
@media (max-width:640px){
  .spot:not(.sel) .tag{display:none}
  .spot .kite{width:22px;height:22px;margin:-11px} .spot .kite b{font-size:11px}
  .place-name{font-size:10px} .place-name.sea{font-size:11px}
  .hud{border-left:6px solid var(--bar);border-radius:4px 14px 14px 4px;box-shadow:-6px 0 0 var(--accent)}
.hud h1{font-size:20px} .hud .big{font-size:22px}
  .key{font-size:10px;padding:4px 9px 5px;max-width:78%;gap:1px}
  .key .label{display:none}
  .key div{gap:2px 9px}
  .key i{width:11px}
  .feed{font-size:10px}
  .credit{font-size:9px}
  .time{grid-template-columns:minmax(0,1fr) auto}
  .time input{grid-column:1/-1;grid-row:2}
}
</style>

<div class="wrap">
  <section class="frame" aria-label="Kitevejr for Aarhus Bugt">
    <div class="map" id="map">
      <canvas id="base" width="560" height="741" aria-hidden="true"></canvas>
      <canvas id="lines" width="1120" height="1482" aria-hidden="true"></canvas>
      <canvas id="shore" width="560" height="741" aria-hidden="true"></canvas>
      <canvas id="wind" width="560" height="741" aria-hidden="true"></canvas>
      <div class="layer" id="names" aria-hidden="true"></div>
      <div class="layer" id="markers"></div>
      <div class="hud glass" aria-live="polite">
        <h1>Bugtvind</h1>
        <div class="now"><svg class="arrow" id="hudarrow" viewBox="0 0 16 16"><path d="M8 1l5 6.2H9.6V15H6.4V7.2H3z"/></svg><span class="big num" id="hudspeed">–</span><small id="hudsub"></small></div>
      </div>
      <div class="north glass">N ↑</div>
      <div class="key glass"><b class="label">Vandet langs kysten</b><div>
        <span><i style="background:var(--side)"></i>sidevind</span>
        <span><i style="background:var(--onshore)"></i>pålands</span>
        <span><i style="background:var(--off)"></i>fralands</span></div>
        <button class="feed" id="feed" type="button" title="Hent vejret igen"><i></i><span id="feedtxt">Henter vejr…</span></button>
      </div>
      <div class="credit">Vejr: Open-Meteo · Kort © OpenStreetMap</div>
    </div>
    <div class="time">
      <span class="when" id="when">Nu</span>
      <input type="range" id="t" min="0" max="47" value="0" step="1" aria-label="Tidspunkt i prognosen">
      <button class="btn" id="now" type="button">Nu</button>
    </div>
    <div class="info" id="info" aria-live="polite"></div>
  </section>
</div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* ---------- spots og steder ---------- */
// facing = kompasretning fra stranden og ud over vandet
const SPOTS = [
  { id:"akrogen", name:"Åkrogen", lat:56.2047, lon:10.2860, facing:125 },
  { id:"skaering", name:"Skæring Strand", lat:56.2282, lon:10.3212, facing:151 },
  { id:"studstrup", name:"Studstrup", lat:56.2451, lon:10.3464, facing:107 },
  { id:"begtrup", name:"Begtrup Vig", lat:56.1541, lon:10.5210, facing:301 },
  { id:"ahl", name:"Ahl Strand", lat:56.1850, lon:10.6553, facing:341, tag:"r" },
  { id:"moesgaard", name:"Moesgård Strand", lat:56.0884, lon:10.2507, facing:74 },
  { id:"ajstrup", name:"Ajstrup Strand", lat:56.0443, lon:10.2726, facing:84 },
  { id:"saksild", name:"Saksild Strand", lat:55.9712, lon:10.2591, facing:73 },
  { id:"maarup", name:"Mårup, Samsø", lat:55.9449, lon:10.5864, facing:60 },
  { id:"saelvig", name:"Sælvig, Samsø", lat:55.8643, lon:10.5562, facing:343 },
  { id:"oer", name:"Øer", lat:56.1503, lon:10.6754, facing:227 },
  { id:"grenaa", name:"Grenaa Strand", lat:56.3942, lon:10.9222, facing:103, tag:"l" },
  { id:"hou", name:"Hou", lat:55.9140, lon:10.2608, facing:112 },
];
/* ---------- kort ---------- */
const BOX = { l:10.03, r:10.97, b:55.755, t:56.45 };

  else { S.wind = null; $("#hudspeed").textContent = "–"; $("#hudsub").textContent = "ingen vinddata"; }
  paintShore(res);
  renderInfo(res.find(r => r.s.id === S.sel));
}

function renderInfo(r) {
  const D = S.data, t = S.t, s = r.s, w = r.w || {}, box = $("#info"); box.textContent = ""; 
  const head = el("header"), hl = el("div"); hl.append(el("span", "label", whenText(t)), el("h2", null, s.name));
  head.append(hl);
  const v = el("div", "verdict"); v.append(el("span", "chip " + r.j.level, r.j.word), el("strong", null, r.j.kind));
  const wd = el("div", "wind"), ang = w.wd == null ? 0 : rel(w.wd, s.facing);
  wd.innerHTML = `<svg viewBox="0 0 100 100" role="img" aria-label="Vindens vinkel på kysten"><rect width="100" height="62" fill="var(--sea-2)"/><path d="M0 50q25-7 50 0t50 0v14H0z" fill="var(--sea-3)"/><path d="M0 58q25-6 50 0t50 0v10H0z" fill="var(--foam)"/><path d="M0 63q25-6 50 0t50 0v37H0z" fill="var(--sand)"/><g transform="rotate(${ang} 50 50)"><path d="M46 12h8v44h9L50 76 37 56h9z" fill="var(--accent)" stroke="#fff6dc" stroke-width="2.5" stroke-linejoin="round"/></g></svg>`;
  const wt = el("div"), big = el("div", "big num", fmt(w.ws, 1)); big.append(el("small", null, " m/s"));
  wt.append(big, el("p", null, w.wd == null ? "Ingen vinddata" : `stød ${fmt(w.wg)} m/s · fra ${dirName(w.wd)} ${Math.round(w.wd)}°`)); wd.append(wt);
  const tr = el("div", "trio"), stat = (lab, val) => { const d = el("div"); d.append(el("span", "label", lab), el("b", "num", val)); tr.append(d); };
  stat("Bølger", fmt(D.sea.wave[t], 1) + " m"); stat("Vand", fmt(D.sea.sst[t]) + " °C"); stat("Luft", fmt(w.ta) + " °C");
  const hs = el("div", "hours"), ol = el("ol"); hs.tabIndex = 0;
  D.times.forEach((iso, i) => { const xw = wx(s.id, i), j = judge(s, xw), li = el("li"), b = el("button", "hr" + (i === t ? " cur" : "") + (i > 0 && iso.endsWith("T00:00") ? " day" : "")); b.type = "button";
    b.title = whenText(i) + ": " + j.kind + ", " + j.word; b.setAttribute("aria-label", `${whenText(i)}: ${fmt(xw.ws)} m/s fra ${xw.wd == null ? "?" : dirName(xw.wd)}, ${j.word}`);
    b.innerHTML = `<span class="t num">${iso.endsWith("T00:00") ? dayName(iso) : iso.slice(11, 13)}</span><svg class="a" viewBox="0 0 16 16" style="transform:rotate(${(xw.wd ?? 0) + 180}deg)">${ARROW}</svg><span class="s num">${fmt(xw.ws)}</span><span class="g num">${fmt(xw.wg)}</span><span class="bar ${j.level}"></span>`;
    b.addEventListener("click", () => { S.t = i; render(); }); li.append(b); ol.append(li); });
  hs.append(ol);
  box.append(head, v, wd, tr, hs);
  const cur = $(".hr.cur", hs); if (cur) hs.scrollLeft = Math.max(0, cur.offsetLeft - 68);
}

/* ---------- vinden som tråde over vandet ---------- */
const wctx = $("#wind").getContext("2d"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const parts = Array.from({ length:54 }, () => ({ x:Math.random() * M, y:Math.random() * H, life:Math.random() * 120 }));
let tk = 0;
function tick() {
  tk++;
  wctx.globalCompositeOperation = "destination-out"; wctx.fillStyle = "rgba(0,0,0,.045)"; wctx.fillRect(0, 0, M, H);
  wctx.globalCompositeOperation = "source-over"; wctx.lineCap = "round";
  const wd = S.wind;
  if (wd) {
    const thread = getComputedStyle(document.documentElement).getPropertyValue("--thread").trim() || "#fff4d2";
    const base = (wd.dir + 180) * Math.PI / 180, v = Math.min(4.2, .5 + wd.sp * .22);
    for (const p of parts) {
      const a = base + (fbm(p.x / 120 + tk * .002, p.y / 120) - .5) * 1.5, nx = p.x + Math.sin(a) * v, ny = p.y - Math.cos(a) * v; p.life--;
      if (p.life < 0 || nx < 0 || ny < 0 || nx >= M || ny >= H) { p.x = Math.random() * M; p.y = Math.random() * H; p.life = 80 + Math.random() * 140; continue; }
      if (!land[Math.floor(ny) * M + Math.floor(nx)]) { wctx.strokeStyle = thread; wctx.globalAlpha = .6; wctx.lineWidth = 1.5; wctx.beginPath(); wctx.moveTo(p.x, p.y); wctx.lineTo(nx, ny); wctx.stroke(); wctx.globalAlpha = 1; }
      p.x = nx; p.y = ny;
    }
  }
  if (!still) requestAnimationFrame(tick);
}

/* ---------- start ---------- */
const repaint = () => { paint(); render(); };
buildStatic(); paint();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", repaint);
new MutationObserver(repaint).observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
$("#t").addEventListener("input", e => { S.t = +e.target.value; render(); });
$("#now").addEventListener("click", () => { S.t = 0; render(); });
$("#feed").addEventListener("click", load);
load().then(() => { if (still) { for (let i = 0; i < 60; i++) tick(); } else tick(); });
setInterval(() => { if (!document.hidden) load(); }, 15 * 60 * 1000);
})();
</script>
